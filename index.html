<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Certificado ProfNLC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
  h1 { color: #f7941d; font-size: 1.6rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.88rem; margin-bottom: 24px; }

  .form-card {
    background: white; border-radius: 12px; padding: 26px 30px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 100%; max-width: 540px; margin-bottom: 28px;
  }
  label { display: block; font-size: 0.82rem; font-weight: 700; color: #444; margin-bottom: 5px; margin-top: 16px; }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%; padding: 10px 13px; border: 1.5px solid #ddd;
    border-radius: 8px; font-size: 0.93rem; background: white;
  }
  input:focus, select:focus { outline: none; border-color: #f7941d; }

  .nota-row { display: flex; gap: 10px; align-items: center; }
  .nota-row input { flex: 0 0 110px; }
  .nota-preview { font-size: 0.82rem; color: #888; }

  .btn-row { display: flex; gap: 12px; margin-top: 22px; }
  button {
    flex: 1; padding: 11px; border: none; border-radius: 8px;
    font-size: 0.95rem; font-weight: bold; cursor: pointer;
  }
  button:hover { opacity: 0.85; }
  #btnPreview  { background: #f7941d; color: white; }
  #btnDownload { background: #2c7a3f; color: white; display: none; }

  .cert-outer { width: 100%; max-width: 920px; }
  #certContainer {
    position: relative; width: 100%; display: none;
    container-type: inline-size;
  }
  #certContainer img.bg {
    width: 100%; display: block;
    border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .ov {
    position: absolute;
    font-family: Calibri, Carlito, Arial, sans-serif;
    font-weight: bold;
    color: #1e1e3a;
    pointer-events: none;
    white-space: nowrap;
    line-height: 1;
  }
  /* Nome: 62px centered at x=1200, baseline 548 (top≈501) */
  #ovNome {
    left: 60%; top: 35.43%;
    font-size: 3.1cqw;
    transform: translateX(-50%);
  }
  /* Texto2: 50px at x=1024, baseline 633 */
  #ovTexto2 { left: 51.2%; top: 42.08%; font-size: 2.5cqw; }
  /* Texto: 50px at x=635, baseline 836 */
  #ovTexto  { left: 31.75%; top: 56.44%; font-size: 2.5cqw; }

  #ovLinha {
    position: absolute;
    left: 23.95%; top: 39.6%;
    width: 72.1%; height: 1.5px;
    background: #1e1e3a;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>🎓 Gerador de Certificado ProfNLC</h1>
<p class="subtitle">Preencha os dados, visualize e baixe em PDF</p>

<div class="form-card">
  <label for="nome">Nome</label>
  <input type="text" id="nome" placeholder="Ex: Ana Beatriz Barbosa Soares" autocomplete="off" />

  <label for="idioma">Idioma</label>
  <select id="idioma">
    <option value="ProfNLC - Leitura em Língua Inglesa.">Inglesa</option>
    <option value="ProfNLC - Leitura em Língua Francesa.">Francesa</option>
    <option value="ProfNLC - Leitura em Língua Espanhola.">Espanhola</option>
  </select>

  <label for="nota">Nota (0–100)</label>
  <div class="nota-row">
    <input type="number" id="nota" min="0" max="100" placeholder="Ex: 94" />
    <span class="nota-preview" id="notaPreview"></span>
  </div>

  <div class="btn-row">
    <button id="btnPreview"  onclick="preview()">👁 Visualizar</button>
    <button id="btnDownload" onclick="downloadPDF()">⬇ Baixar PDF</button>
  </div>
</div>

    <div id="ovLinha"></div>
    <div class="ov" id="ovNome"></div>
    <div class="ov" id="ovTexto2"></div>
    <div class="ov" id="ovTexto"></div>
  </div>
</div>

<script>
document.getElementById('nota').addEventListener('input', function () {
  const v = this.value.trim();
  document.getElementById('notaPreview').textContent = v ? `→ "${v} pontos de 100."` : '';
});

function getValues() {
  const nome   = document.getElementById('nome').value.trim();
  const idioma = document.getElementById('idioma').value;
  const nota   = document.getElementById('nota').value.trim();
  const texto  = nota ? `${nota} pontos de 100.` : '';
  return { nome, idioma, texto };
}

function preview() {
  const { nome, idioma, texto } = getValues();
  if (!nome) { alert('Preencha o Nome!'); return; }

  document.getElementById('ovNome').textContent   = nome;
  document.getElementById('ovTexto2').textContent = idioma;
  document.getElementById('ovTexto').textContent  = texto;

  const container = document.getElementById('certContainer');
  container.style.display = 'block';
  document.getElementById('btnDownload').style.display = 'block';
  setTimeout(() => container.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

function renderCanvas() {
  const { nome, idioma, texto } = getValues();
  const bgImg = document.getElementById('bgImg');
  const canvas = document.createElement('canvas');
  canvas.width  = bgImg.naturalWidth;   // 2000
  canvas.height = bgImg.naturalHeight;  // 1414
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bgImg, 0, 0);

  const FONT = 'Calibri, Carlito, Arial';
  ctx.fillStyle = '#1e1e3a';

  // Underline
  ctx.strokeStyle = '#1e1e3a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(479, 560);
  ctx.lineTo(1921, 560);
  ctx.stroke();

  // Nome: bold 62px, centered, auto-shrink if too long for the line
  let nomeSize = 62;
  ctx.font = `bold ${nomeSize}px ${FONT}`;
  while (ctx.measureText(nome).width > 1400 && nomeSize > 36) {
    nomeSize -= 2;
    ctx.font = `bold ${nomeSize}px ${FONT}`;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(nome, 1200, 548);

  // Idioma e pontos: bold 50px
  ctx.font = `bold 50px ${FONT}`;
  ctx.textAlign = 'left';
  ctx.fillText(idioma, 1024, 633);
  ctx.fillText(texto, 635, 836);

  return canvas;
}

function downloadPDF() {
  const { nome } = getValues();
  if (!nome) { alert('Preencha o Nome!'); return; }

  const canvas = renderCanvas();
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  const safeName = nome.replace(/[^\wÀ-ÿ ]/g, '').replace(/\s+/g, '_');

  try {
    const { jsPDF } = window.jspdf;
    // A4 landscape: 297 x 210 mm — same aspect ratio as the certificate (1.414)
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
    pdf.save(`Certificado_ProfNLC_${safeName}.pdf`);
  } catch (e) {
    // Fallback: PNG if jsPDF failed to load (e.g. no internet)
    alert('Não foi possível gerar PDF (verifique sua conexão). Baixando PNG.');
    const a = document.createElement('a');
    a.download = `Certificado_ProfNLC_${safeName}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') preview(); });
</script>
</body>
